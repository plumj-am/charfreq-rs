[package]
authors     = [ "PlumJam <git@plumj.am>" ]
categories  = [ "command-line-utilities" ]
description = "Analyse character frequencies in a repository."
edition     = "2024"
homepage    = "https://github.com/plumj-am/charfreq-rs"
keywords    = [ "cli", "counter", "terminal" ]
license     = "MIT"
name        = "charfreq"
readme      = "README.md"
repository  = "https://github.com/plumj-am/charfreq-rs"
version     = "0.7.0"

[[bin]]
name = "charfreq"
path = "src/main.rs"

[dependencies]
mimalloc = { default-features = false, version = "0.1.46" }
pound    = "0.1.6"
rayon    = "1.10.0"

[profile.release]
codegen-units = 1
debug         = false
lto           = "fat"
opt-level     = 3
panic         = "abort"
strip         = "symbols"

[lints.clippy]
cargo       = { level = "warn", priority = -1 }
complexity  = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
nursery     = { level = "warn", priority = -1 }
pedantic    = { level = "warn", priority = -1 }
perf        = { level = "warn", priority = -1 }
restriction = { level = "warn", priority = -1 }
style       = { level = "warn", priority = -1 }
suspicious  = { level = "warn", priority = -1 }

blanket_clippy_restriction_lints = "allow"

absolute_paths                    = "allow"
arbitrary_source_item_ordering    = "allow"
arithmetic_side_effects           = "allow"
as_conversions                    = "allow"
as_pointer_underscore             = "allow"
as_underscore                     = "allow"
cast_possible_truncation          = "allow"
cast_precision_loss               = "allow" # TODO: check
clone_on_ref_ptr                  = "allow"
cognitive_complexity              = "allow"
dbg_macro                         = "allow"
decimal_literal_representation    = "allow"
else_if_without_else              = "allow"
error_impl_error                  = "allow"
exhaustive_enums                  = "allow"
exhaustive_structs                = "allow"
field_scoped_visibility_modifiers = "allow"
float_arithmetic                  = "allow"
impl_trait_in_params              = "allow"
implicit_return                   = "allow"
indexing_slicing                  = "allow"
inline_modules                    = "allow"
integer_division                  = "allow"
integer_division_remainder_used   = "allow"
iter_over_hash_type               = "allow"
let_underscore_untyped            = "allow"
map_err_ignore                    = "allow"
match_ref_pats                    = "allow"
match_same_arms                   = "allow"
min_ident_chars                   = "allow"
missing_docs_in_private_items     = "allow"
missing_inline_in_public_items    = "allow"
mod_module_files                  = "allow"
modulo_arithmetic                 = "allow"
multiple_crate_versions           = "allow"
non_ascii_literal                 = "allow"
pattern_type_mismatch             = "allow" # TODO: check
print_stderr                      = "allow"
print_stdout                      = "allow"
pub_use                           = "allow"
question_mark_used                = "allow"
ref_patterns                      = "allow"
semicolon_outside_block           = "allow"
separated_literal_suffix          = "allow"
shadow_reuse                      = "allow"
shadow_same                       = "allow"
shadow_unrelated                  = "allow"
single_call_fn                    = "allow"
single_char_lifetime_names        = "allow"
single_match_else                 = "allow"
std_instead_of_alloc              = "allow"
string_slice                      = "allow"
todo                              = "allow"
too_many_lines                    = "allow"
try_err                           = "allow"
unimplemented                     = "allow"
unreachable                       = "allow"
unwrap_used                       = "deny"
use_debug                         = "allow"
wildcard_enum_match_arm           = "allow"
